[project]
name = "clima-curitiba"
version = "0.1.0"
description = "Relatório mensal de temperatura e chuva em Curitiba (NOAA GSOD, estação 83842)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
