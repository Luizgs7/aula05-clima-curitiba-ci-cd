name: Renderizar relatório

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: quarto-dev/quarto-actions/setup@v2.2.0
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Renderizar report.qmd
        env:
          PYTHONPATH: src
        run: quarto render report.qmd --to html
      - name: Guardar relatório para revisão
        uses: actions/upload-artifact@v7.0.2
        with:
          name: relatorio-html
          path: report.html
          retention-days: 14
